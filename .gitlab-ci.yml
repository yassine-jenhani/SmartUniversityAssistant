
stages:
  - test
  - build

variables:
  # Maven dependency cache
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

  # Temporary PostgreSQL database for CI
  POSTGRES_DB: "smart_university_assistant_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "yassino"
  POSTGRES_HOST_AUTH_METHOD: "trust"

  # Spring Boot database connection
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/smart_university_assistant_db"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "yassino"

  # Seeder configuration: test-only credentials
  SUPER_ADMIN_EMAIL: "system.administrator@gmail.com"
  SUPER_ADMIN_PASSWORD: "CI-only-password-123!"

cache:
  key: maven-dependencies
  paths:
    - .m2/repository/

backend_test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - name: postgres:14-alpine
      alias: postgres
  script:
    - cd SmartUniversityAssistant-Backend
    - mvn --batch-mode test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

backend_build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd SmartUniversityAssistant-Backend
    - mvn --batch-mode -DskipTests package
  artifacts:
    paths:
      - SmartUniversityAssistant-Backend/target/*.jar
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
